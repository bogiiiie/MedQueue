<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedQueue — Staff Login</title>
  <meta name="description" content="Staff login portal for MedQueue counter dashboard access.">
  <meta name="theme-color" content="#0066FF">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/output.css">
  <style>
    .font-sans { font-family: "Geist", sans-serif; }
    .font-mono { font-family: "Geist Mono", monospace; }
  </style>
</head>

<body class="relative min-h-screen bg-[#F7F8FA] font-sans flex flex-col items-center justify-center px-4 py-8">


  <!-- =========================================================
       LOGIN CARD
       ========================================================= -->
  <main class="w-full max-w-[380px]" id="main-content">
    <div class="bg-white rounded-[10px] border border-gray-200 p-8 shadow-[0_4px_16px_rgba(0,0,0,0.06)]">

      <!-- Logo & heading -->
      <div class="flex flex-col items-center mb-6">
        <div class="w-12 h-12 flex items-center justify-center bg-gray-100 rounded-lg mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="#0066FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />
          </svg>
        </div>
        <h1 class="text-[20px] font-semibold text-gray-900">MedQueue</h1>
        <p class="text-[13px] text-gray-500 mt-0.5">Staff Portal</p>
      </div>

      <hr class="border-none h-px bg-gray-200 mb-5" aria-hidden="true">

      <!-- Login form -->
      <form class="flex flex-col gap-4" id="staff-login-form" novalidate>

        <!-- Username -->
        <div>
          <label for="username" class="block text-[13px] font-medium text-gray-700 mb-1.5">
            Username
          </label>
          <div class="relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
              xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input
              class="w-full h-9 pl-[34px] pr-3 text-sm text-gray-700 bg-white border border-gray-200 rounded-[7px] outline-none transition-all focus:border-[#0066FF] focus:ring-2 focus:ring-[#0066FF]/10 font-[inherit] placeholder:text-gray-400 aria-[invalid=true]:border-red-500"
              type="text" id="username" name="username" placeholder="staff.username"
              autocomplete="username" required aria-required="true"
              aria-describedby="username-error" spellcheck="false">
          </div>
          <p class="mt-1 text-xs text-red-600" id="username-error" role="alert" hidden>
            Please enter your username.
          </p>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-[13px] font-medium text-gray-700 mb-1.5">
            Password
          </label>
          <div class="relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
              xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input
              class="w-full h-9 pl-[34px] pr-10 text-sm text-gray-700 bg-white border border-gray-200 rounded-[7px] outline-none transition-all focus:border-[#0066FF] focus:ring-2 focus:ring-[#0066FF]/10 font-[inherit] placeholder:text-gray-400 aria-[invalid=true]:border-red-500"
              type="password" id="password" name="password" placeholder="••••••••"
              autocomplete="current-password" required aria-required="true"
              aria-describedby="password-error">
            <button
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-gray-500 active:text-gray-500 transition-colors"
              type="button" id="password-toggle" aria-label="Show password" aria-controls="password">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true" id="password-toggle-icon">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <p class="mt-1 text-xs text-red-600" id="password-error" role="alert" hidden>
            Please enter your password.
          </p>
        </div>

        <!-- Remember me -->
        <div class="flex items-center gap-2">
          <input
            class="w-3.5 h-3.5 cursor-pointer accent-[#0066FF]"
            type="checkbox" id="remember" name="remember">
          <label for="remember" class="text-[13px] text-gray-600 cursor-pointer font-normal">
            Remember me
          </label>
        </div>

        <!-- Submit -->
        <button
          class="w-full h-9 flex items-center justify-center gap-2 bg-[#0066FF] hover:bg-[#0052CC] active:bg-[#0052CC] text-white text-sm font-medium rounded-[7px] cursor-pointer transition-colors"
          type="submit" id="login-btn">
          Login
        </button>

      </form>

      <!-- Forgot password -->
      <p class="mt-4 text-[12px] text-gray-400 text-center">
        Forgot password?
        <a class="hover:text-gray-500 active:text-gray-500 transition-colors" href="#">Contact your administrator.</a>
      </p>

      <hr class="border-none h-px bg-gray-200 my-4" aria-hidden="true">

      <!-- Patient link -->
      <p class="text-[13px] text-gray-500 text-center">
        Patient?
        <a class="text-gray-700 font-medium hover:text-gray-900 active:text-gray-900 transition-colors" href="/">
          Generate your queue →
        </a>
      </p>

    </div>

    <!-- Version -->
    <p class="mt-4 text-[11px] text-gray-400 text-center">MedQueue v1.0</p>

  </main>


  <!-- =========================================================
       PAGE SWITCHER (fixed bottom-right)
       ========================================================= -->
  <div class="fixed bottom-5 right-5 z-50" id="page-switcher-wrapper">

    <div
      class="absolute bottom-full right-0 mb-2 bg-white border border-gray-200 rounded-[10px] shadow-[0_4px_20px_rgba(0,0,0,0.12)] py-1.5 w-52"
      id="page-switcher-menu" role="menu" aria-label="Switch page" hidden>

      <p class="px-3 py-1 text-[11px] uppercase tracking-wide text-gray-400 mb-1"
        id="page-switcher-label" role="presentation">Pages</p>

      <button
        id="nav-queue-generator-btn"
        class="w-full text-left px-3 py-2 text-sm flex items-center justify-between text-gray-700 cursor-pointer hover:bg-gray-100 active:bg-gray-100 transition-colors"
        type="button" role="menuitem">Queue Generator</button>
      <button
        id="nav-live-display-btn"
        class="w-full text-left px-3 py-2 text-sm flex items-center justify-between text-gray-700 cursor-pointer hover:bg-gray-100 active:bg-gray-100 transition-colors"
        type="button" role="menuitem">Live Display</button>
      <button
        id="nav-queue-status-btn"
        class="w-full text-left px-3 py-2 text-sm flex items-center justify-between text-gray-700 cursor-pointer hover:bg-gray-100 active:bg-gray-100 transition-colors"
        type="button" role="menuitem">Queue Status</button>

      <!-- Active item -->
      <button
        id="nav-staff-login-btn"
        class="w-full text-left px-3 py-2 text-sm flex items-center justify-between text-[#0066FF] bg-[#EFF5FF] cursor-pointer transition-colors"
        type="button" role="menuitem" aria-current="page">
        Staff Login
        <span class="w-1.5 h-1.5 rounded-full bg-[#0066FF]" aria-hidden="true"></span>
      </button>

      <button
        id="nav-counter-dashboard-btn"
        class="w-full text-left px-3 py-2 text-sm flex items-center justify-between text-gray-700 cursor-pointer hover:bg-gray-100 active:bg-gray-100 transition-colors"
        type="button" role="menuitem">Counter Dashboard</button>

    </div>

    <button
      class="flex items-center gap-2 h-9 px-3 bg-white border border-gray-200 rounded-[9px] shadow-[0_2px_8px_rgba(0,0,0,0.1)] text-sm text-gray-700 font-medium cursor-pointer hover:bg-gray-50 active:bg-gray-50 transition-colors"
      id="page-switcher-trigger" type="button"
      aria-haspopup="menu" aria-expanded="false"
      aria-controls="page-switcher-menu"
      aria-label="Switch page — currently on Staff Login">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
        stroke="#0066FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M15 3h6v6" />
        <path d="M10 14 21 3" />
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
      </svg>
      Staff Login
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
        stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>

  </div>


  <!-- =========================================================
       SCRIPTS
       ========================================================= -->
  <script src="js/staff-login.js"></script>
  <script src="js/page-switcher.js"></script>

</body>

</html>
